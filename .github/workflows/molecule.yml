---
name: molecule

'on':
  pull_request:
  push:
    branches: [main]

jobs:
  molecule:
    name: molecule (${{ matrix.platform }}, ${{ matrix.auth }})
    runs-on: ubuntu-24.04
    # EPEL has no Slurm for released EL 10 (10.2); el10 moves to OpenHPC 4 in T12
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu2404
            image: geerlingguy/docker-ubuntu2404-ansible:latest
            auth: auth/slurm
            experimental: false
          - platform: ubuntu2404
            image: geerlingguy/docker-ubuntu2404-ansible:latest
            auth: auth/munge
            experimental: false
          - platform: el10
            image: geerlingguy/docker-rockylinux10-ansible:latest
            auth: auth/slurm
            experimental: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          pip install ansible-core==2.19.14 molecule==26.10.0 docker==7.1.0
          ansible-galaxy collection install community.docker:==4.8.5

      - name: Run molecule
        run: molecule test
        env:
          MOLECULE_IMAGE: ${{ matrix.image }}
          MOLECULE_SLURM_AUTH: ${{ matrix.auth }}
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
