---
- name: Prepare
  hosts: all
  tasks:
    - name: Refresh apt cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Enable EPEL and CRB
      when: ansible_os_family == 'RedHat'
      block:
        - name: Install EPEL
          ansible.builtin.dnf:
            name: [epel-release, dnf-plugins-core]

        - name: Enable CRB
          ansible.builtin.command: dnf config-manager --set-enabled crb
          changed_when: false

        - name: Install the OpenHPC release package (OpenHPC 2/3/4 for EL 8/9/10)
          ansible.builtin.dnf:
            name: "https://repos.openhpc.community/OpenHPC/{{ __ohpc }}/EL_{{ __el }}/x86_64/ohpc-release-{{ __ohpc }}-1.el{{ __el }}.x86_64.rpm"
          vars:
            __el: "{{ ansible_distribution_major_version }}"
            __ohpc: "{{ (__el | int) - 6 }}"
          when: lookup('env', 'MOLECULE_PACKAGE_SOURCE') == 'openhpc'

    # The role only copies a key given in slurm_munge_key; EL's munge package doesn't create one
    - name: Install munge
      ansible.builtin.package:
        name: munge

    - name: Create munge key
      ansible.builtin.command: mungekey --create
      args:
        creates: /etc/munge/munge.key

    - name: Set munge key ownership
      ansible.builtin.file:
        path: /etc/munge/munge.key
        owner: munge
        group: munge
        mode: "0400"
