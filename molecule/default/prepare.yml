---
- name: Prepare
  hosts: all
  tasks:
    - name: Refresh apt cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Enable EPEL and CRB
      when: ansible_os_family == 'RedHat'
      block:
        - name: Install EPEL
          ansible.builtin.dnf:
            name: [epel-release, dnf-plugins-core]

        - name: Enable CRB
          ansible.builtin.command: dnf config-manager --set-enabled crb
          changed_when: false

        # Slurm is only in EPEL 10.3+ (26.05 with auth/slurm); drop once Rocky 10.3 is out
        - name: Add EPEL 10.3 on EL 10 hosts older than 10.3
          ansible.builtin.yum_repository:
            name: epel-10.3
            description: EPEL 10.3
            baseurl: https://dl.fedoraproject.org/pub/epel/10.3/Everything/$basearch/
            gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-EPEL-10
            gpgcheck: true
          when: ansible_distribution_major_version == '10' and ansible_distribution_version is version('10.3', '<')

        - name: Install the OpenHPC release package (OpenHPC 2/3/4 for EL 8/9/10)
          ansible.builtin.dnf:
            name: "https://repos.openhpc.community/OpenHPC/{{ __ohpc }}/EL_{{ __el }}/x86_64/ohpc-release-{{ __ohpc }}-1.el{{ __el }}.x86_64.rpm"
            # This package carries the OpenHPC key, so it can't be verified first. dnf's own
            # default (localpkg_gpgcheck=False) skips the check too; repo packages stay verified.
            disable_gpg_check: true
          vars:
            __el: "{{ ansible_distribution_major_version }}"
            __ohpc: "{{ (__el | int) - 6 }}"
          when: lookup('env', 'MOLECULE_PACKAGE_SOURCE') == 'openhpc'

    # The role only copies a key given in slurm_munge_key; EL's munge package doesn't create one
    - name: Install munge
      ansible.builtin.package:
        name: munge

    # munge >= 0.5.14 has mungekey; EL 9's 0.5.13 only ships create-munge-key
    - name: Create munge key
      ansible.builtin.shell: if command -v mungekey >/dev/null; then mungekey --create; else create-munge-key; fi
      args:
        creates: /etc/munge/munge.key

    - name: Set munge key ownership
      ansible.builtin.file:
        path: /etc/munge/munge.key
        owner: munge
        group: munge
        mode: "0400"
