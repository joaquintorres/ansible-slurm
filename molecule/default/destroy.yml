---
- name: Destroy
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove containers
      community.docker.docker_container:
        name: "{{ item.name }}"
        state: absent
      loop: "{{ molecule_yml.platforms }}"

    - name: Clear instance config
      ansible.builtin.copy:
        content: "[]\n"
        dest: "{{ molecule_instance_config }}"
        mode: "0600"
