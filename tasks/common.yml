---

- name: Install Slurm client
  ansible.builtin.package:
    name: "{{ __slurm_packages.client }}"
    state: "{{ 'latest' if slurm_upgrade else 'present' }}"

- name: Include config dir creation tasks
  ansible.builtin.include_tasks: _inc_create_config_dir.yml
  when: slurm_create_dirs

- name: Install log rotation configuration
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/slurm
    mode: 0644
  when: slurm_rotate_logs

# auth/slurm (23.11+): key from the authentication docs, owned by SlurmUser, mode 0600
- name: Generate slurm.key on the control node
  ansible.builtin.shell: umask 077 && dd if=/dev/random of={{ __slurm_key_src | quote }} bs=1024 count=1
  args:
    creates: "{{ __slurm_key_src }}"
  delegate_to: localhost
  become: false
  run_once: true
  when: __slurm_config_merged.AuthType == 'auth/slurm' and slurm_key is not defined

- name: Install slurm.key
  ansible.builtin.copy:
    src: "{{ __slurm_key_src }}"
    dest: "{{ slurm_config_dir }}/slurm.key"
    owner: "{{ __slurm_user_name }}"
    group: "{{ __slurm_group_name }}"
    mode: "0600"
  no_log: true
  when:
    - __slurm_config_merged.AuthType == 'auth/slurm'
    - slurm_roles | length > 0 or group_names | intersect(['slurmservers', 'slurmexechosts', 'slurmdbdservers']) | length > 0
    - not ansible_check_mode or __slurm_key_src is file
  notify:
    - Restart slurmdbd
    - Restart slurmctld
    - Restart slurmd

- name: Install slurm.conf
  ansible.builtin.template:
    src: "slurm.conf.j2"
    dest: "{{ slurm_config_dir }}/slurm.conf"
    owner: root
    group: root
    mode: 0444
  notify:
    - Restart slurmd
    - Restart slurmctld

# scontrol reads slurm.conf even for --version, so run this after installing it
- name: Get installed Slurm version
  ansible.builtin.command: scontrol --version
  register: __slurm_version_cmd
  changed_when: false
  check_mode: false
  failed_when: __slurm_version_cmd.rc != 0 and not ansible_check_mode

- name: Set installed Slurm version fact
  ansible.builtin.set_fact:
    __slurm_version: "{{ __slurm_version_cmd.stdout | default('') | regex_search('[0-9]+\\.[0-9]+') | default('0', true) }}"

- name: Include munge tasks
  ansible.builtin.include_tasks: munge.yml
  when: slurm_configure_munge
